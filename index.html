<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accueil – Maradona DataViz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="home">
  <nav>
    <a href="index.html">Accueil</a>
    <a href="visualisations.html">Visualisations</a>
    <a href="a-propos.html">À propos</a>
  </nav>

  <h1>Bienvenue sur Maradona DataViz</h1>
  <p>Découvrez les performances de Maradona à travers des graphiques interactifs.</p>

  <!-- ===== CARD FLIP 3D ===== -->
  <div class="jersey-card">
    <div class="jersey-inner">

      <!-- Face avant -->
      <div class="jersey-front">
        <div class="jersey">
          <div class="name">MARADONA</div>
          <div class="number">10</div>
        </div>
      </div>

      <!-- Face arrière -->
      <div class="jersey-back">
        <p>Diego Maradona</p>
      </div>

    </div>
  </div>

  <!-- ===== MODAL INFOGRAPHIE ===== -->
  <div id="infographicModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <img src="image/Carrara_Hugo_infographie_Maradona.jpg" alt="Infographie Maradona">
    </div>
  </div>

  <!-- ===== SCRIPT ===== -->
  <script>
    const card = document.querySelector('.jersey-card');
    const modal = document.getElementById('infographicModal');
    const closeBtn = document.querySelector('.close');

    card.addEventListener('click', () => {
      card.classList.add('flipped');
      setTimeout(() => {
        modal.style.display = 'flex';
      }, 800);
    });

    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
      card.classList.remove('flipped');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
        card.classList.remove('flipped');
      }
    });
  </script>

</body>
</html>
